<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중화 반응 시뮬레이터</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.btb{height:120px;border:1px solid #ccc;border-radius:12px}.report textarea,.report input{width:100%;padding:10px;margin-top:8px;margin-bottom:12px} @media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="card"><h2>[10통과2-01-04] 중화 반응 시뮬레이터</h2><p>염산(HCl)과 수산화 나트륨(NaOH) 혼합</p><div class="grid"><div><label>염산 부피: <span id="acidVal">50</span> mL</label><input id="acid" type="range" min="0" max="100" value="50"><br><br><label>수산화 나트륨 부피: <span id="baseVal">50</span> mL</label><input id="base" type="range" min="0" max="100" value="50"><h3 id="state"></h3><p>예상 pH: <span id="ph"></span></p><p>최고 온도: <span id="temp"></span> ℃</p><div id="btb" class="btb"></div></div><div><canvas id="chart"></canvas></div></div></div><div class="card report"><h2>디지털 탐구 보고서</h2><input placeholder="탐구 제목"><textarea rows="3" placeholder="실험 조건"></textarea><textarea rows="4" placeholder="관찰 결과"></textarea><textarea rows="4" placeholder="결과 해석"></textarea><textarea rows="3" placeholder="생활 속 중화 반응 활용 사례"></textarea></div><script>const acid=document.getElementById('acid'),base=document.getElementById('base');const ctx=document.getElementById('chart');let chart;function update(){let a=+acid.value,b=+base.value;acidVal.textContent=a;baseVal.textContent=b;let diff=b-a;let color='#2ecc71',state='중성',ph=7;if(diff<0){color='#f1c40f';state='산성';ph=Math.max(1,7+diff/5)}if(diff>0){color='#2980b9';state='염기성';ph=Math.min(13,7+diff/5)}document.getElementById('btb').style.background=color;document.getElementById('state').textContent='용액 상태: '+state;document.getElementById('ph').textContent=ph.toFixed(1);let temp=25+Math.min(a,b)*0.006;document.getElementById('temp').textContent=temp.toFixed(1);let data=[];for(let i=0;i<=100;i+=5){data.push({x:i,y:25+Math.min(a,i)*0.006});} if(chart) chart.destroy(); chart=new Chart(ctx,{type:'line',data:{datasets:[{label:'최고 온도',data:data,borderColor:'blue'}]},options:{parsing:false,scales:{x:{title:{display:true,text:'반응시킨 염기 수용액의 부피(mL)'}},y:{title:{display:true,text:'혼합 용액의 최고 온도(℃)'}}}}});}acid.oninput=update;base.oninput=update;update();</script></body></html>
